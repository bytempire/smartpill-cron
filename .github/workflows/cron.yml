name: SmartPill reminders

# Hobby Vercel can't run minutely cron. This public-repo job runs every 30
# minutes and pings SmartPill once per minute for ~28 minutes.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Ping SmartPill every minute
        run: |
          set -u
          end=$((SECONDS + 1680))
          i=0
          while [ "$SECONDS" -lt "$end" ]; do
            i=$((i + 1))
            echo "tick $i at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            curl -fsS -m 25 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://smartpill-lemon.vercel.app/api/cron" \
              || echo "curl failed (will retry)"
            echo
            sleep 60
          done
